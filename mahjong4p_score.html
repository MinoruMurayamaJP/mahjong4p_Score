<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15395f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="麻雀スコア">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>麻雀スコア</title>
  <link rel="apple-touch-icon" href="./mahjong4p_score.jpg">
  <link rel="icon" href="./mahjong4p_score.jpg" type="image/jpeg">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #d9e0e7;
      --text: #17202a;
      --muted: #647282;
      --plus: #1264c8;
      --minus: #c83232;
      --warn: #a65f00;
      --button: #15395f;
      --button-text: #ffffff;
      --main-font-size: 23px;
      --button-font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ポップアップ表示時に背景のスクロールを禁止する設定 */
    body.modal-open {
      overflow: hidden !important;
    }

    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(244, 246, 248, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 10px rgba(23, 32, 42, 0.06);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px 6px;
    }

    h1 {
      margin: 0;
      font-size: var(--main-font-size);
      line-height: 1.2;
    }

    .version {
      color: var(--muted);
      font-size: var(--button-font-size);
      font-weight: 700;
      white-space: nowrap;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 12px 28px;
    }

    .sticky-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 12px 10px;
    }

    .sticky-inner section {
      margin-bottom: 8px;
    }

    section {
      margin-bottom: 12px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .head-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    h2 {
      margin: 0;
      font-size: var(--main-font-size);
    }

    .muted {
      color: var(--muted);
      font-size: var(--button-font-size);
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: var(--main-font-size);
      text-align: center;
    }

    input {
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: var(--main-font-size);
      text-align: center;
    }

    input[type="number"] {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .setting-card {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .setting-card input {
      margin-top: 6px;
      min-height: 42px;
      font-weight: 700;
    }

    .totals {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .total-card {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .name {
      min-height: 20px;
      overflow: hidden;
      color: var(--text);
      font-size: var(--main-font-size);
      font-weight: 700;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score {
      margin-top: 4px;
      font-size: var(--main-font-size);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .money {
      margin-top: 2px;
      font-size: var(--main-font-size);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .plus {
      color: var(--plus);
    }

    .minus {
      color: var(--minus);
    }

    .round {
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .round:last-child {
      margin-bottom: 0;
    }

    .round-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .round-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .balance {
      color: var(--muted);
      font-size: var(--button-font-size);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .balance.warn {
      color: var(--warn);
    }

    .round-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .input-card {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    .player-btn {
      display: block;
      width: 100%;
      min-height: 36px;
      padding: 2px 4px;
      background: #e8edf3;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: var(--main-font-size);
      font-weight: 700;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .player-btn:active {
      background: #d1daf0;
    }

    .input-card.locked .player-btn {
      background: transparent;
      border-color: transparent;
      cursor: default;
      padding: 2px 4px;
    }

    .auto {
      margin-top: 6px;
      text-align: center;
      font-size: var(--main-font-size);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* ーーー 追加：ポップアップ（モーダル）用の一割大きいスタイル設定 ーーー */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-overlay.show {
      display: flex;
    }

    /* 指示：サイズは一割くらい大きめで（1.1倍に拡大表示） */
    .modal-container {
      width: 100%;
      max-width: 792px; /* 元の720pxの1.1倍 */
      transform: scale(1.1);
      transform-origin: center;
      padding: 4px;
    }

    /* モーダル内の一割大きい各種パーツ調整 */
    .modal-container .round {
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
      border-width: 2px;
    }
    /* ーーーーーーーーーーーーーーーーーーーーーーーーーーーーーーーーーーー */

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .image-preview {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      text-align: center;
    }

    .image-preview.show {
      display: block;
    }

    .image-preview img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .image-preview img:not([src]) {
      display: none;
    }

    .image-preview a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      margin-top: 2em;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--button);
      color: var(--button-text);
      font-size: var(--button-font-size);
      font-weight: 700;
      text-decoration: none;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      background: var(--button);
      color: var(--button-text);
      font: inherit;
      font-size: var(--button-font-size);
      font-weight: 700;
    }

    button.small {
      min-height: 42px;
      padding: 6px 10px;
      font-size: var(--button-font-size);
      white-space: nowrap;
    }

    button.secondary {
      background: #e8edf3;
      color: var(--text);
    }

    button.danger {
      background: #b92f2f;
      color: #fff;
    }

    button.round-clear {
      background: #f8c7d5;
      color: #7a2034;
    }

    button.round-lock {
      background: #d8ecff;
      color: #174c7c;
    }

    button.round-lock.locked {
      background: #174c7c;
      color: #ffffff;
      border: 2px solid #174c7c;
    }

    /* ポップアップ内の「入力完了」状態の緑色ボタンのスタイル */
    button.round-lock.editing-active {
      background: #15395f;
      color: #ffffff;
      border: 2px solid #15395f;
    }

    button.input-mode {
      background: #d8ecff;
      color: #174c7c;
      border: 0;
    }

    button.input-mode.active {
      background: #174c7c;
      color: #ffffff;
      border: 2px solid #174c7c;
    }

    button.all-lock {
      background: #d8ecff;
      color: #174c7c;
    }

    .input-card.locked {
      background: #f1f3f5;
      opacity: 0.72;
    }

    .setting-card.locked {
      background: #f1f3f5;
      opacity: 0.72;
    }

    .input-card input:disabled {
      color: var(--text);
      -webkit-text-fill-color: var(--text);
      background: #eef1f4;
    }

    @media (min-width: 620px) {
      .totals {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .settings {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .round-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>

  <div id="modalOverlay" class="modal-overlay">
    <div id="modalContainer" class="modal-container">
      </div>
  </div>

  <div class="sticky-top">
    <header>
      <h1>麻雀スコア</h1>
      <div class="version">Ver.20260612-0335</div>
    </header>

    <div class="sticky-inner">
      <section>
        <div class="section-head">
          <h2>合計</h2>
          <div class="head-actions">
            <button id="toggleAllLocks" type="button" class="small all-lock">全ての入力ロック</button>
            <button id="jumpToSettings" type="button" class="secondary small">設定へ</button>
            <button id="makeImage" type="button" class="secondary small">画像作成</button>
            <button id="clearScores" type="button" class="danger small">全ての点数クリア</button>
          </div>
        </div>
        <div id="rateLabel" class="muted"></div>
        <div id="totals" class="totals"></div>
      </section>
    </div>
  </div>

  <main>
    <section id="scoreInputSection">
      <div class="section-head">
        <h2>入力</h2>
        <span class="muted">名前タップで＋－反転 / 空欄1人なら差額補完</span>
      </div>
      <div id="rounds"></div>
      <div class="actions">
        <button id="addRound" type="button" class="secondary">回を追加</button>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>設定</h2>
        <div class="head-actions">
          <button id="settingsLockToggle" type="button" class="small round-lock">入力ロック</button>
          <button id="inputModeToggle" type="button" class="small input-mode">入力モード</button>
          <button id="jumpToInput" type="button" class="secondary small">入力へ戻る</button>
          <span class="muted">自動保存</span>
        </div>
      </div>
      <div class="settings">
        <div class="setting-card">
          <label for="rate">倍率</label>
          <input id="rate" inputmode="numeric" type="text">
        </div>
        <div class="setting-card">
          <label for="player0">P1</label>
          <input id="player0" type="text">
        </div>
        <div class="setting-card">
          <label for="player1">P2</label>
          <input id="player1" type="text">
        </div>
        <div class="setting-card">
          <label for="player2">P3</label>
          <input id="player2" type="text">
        </div>
        <div class="setting-card">
          <label for="player3">P4</label>
          <input id="player3" type="text">
        </div>
      </div>
    </section>

    <section id="imagePreview" class="image-preview">
      <div class="section-head">
        <h2>画像</h2>
        <button id="backToInputFromImage" type="button" class="secondary small">入力へ戻る</button>
      </div>
      <img id="scoreImage" alt="麻雀スコア画像">
      <a id="downloadImage" href="#" download="mahjong-score.png">画像を保存</a>
      <div class="muted">iPhoneでは画像を長押しして保存できます。</div>
    </section>
  </main>

  <script>
    const saveKey = "mahjong4p-score-v1";
    const playerCount = 4;

    const initialState = {
      rate: 50,
      settingsLocked: true,
      selectAllOnFocus: true,
      players: ["川口", "田中", "宮腰", "村山"],
      rounds: Array.from({ length: 20 }, (_, index) => ({
        number: index + 1,
        inputs: Array(playerCount).fill(null),
        locked: true
      }))
    };

    let state = loadState();
    let currentInPopupRoundIndex = null; // 現在ポップ画面で開いている回の番号を記録

    const rateInput = document.getElementById("rate");
    const rateLabel = document.getElementById("rateLabel");
    const totalsEl = document.getElementById("totals");
    const roundsEl = document.getElementById("rounds");
    const addRoundButton = document.getElementById("addRound");
    const clearScoresButton = document.getElementById("clearScores");
    const toggleAllLocksButton = document.getElementById("toggleAllLocks");
    const settingsLockToggleButton = document.getElementById("settingsLockToggle");
    const inputModeToggleButton = document.getElementById("inputModeToggle");
    const jumpToSettingsButton = document.getElementById("jumpToSettings");
    const jumpToInputButton = document.getElementById("jumpToInput");
    const makeImageButton = document.getElementById("makeImage");
    const imagePreview = document.getElementById("imagePreview");
    const scoreImage = document.getElementById("scoreImage");
    const downloadImage = document.getElementById("downloadImage");
    const backToInputFromImageButton = document.getElementById("backToInputFromImage");
    const playerInputs = Array.from({ length: playerCount }, (_, index) => document.getElementById(`player${index}`));

    // モーダル表示用のHTML要素を取得
    const modalOverlay = document.getElementById("modalOverlay");
    const modalContainer = document.getElementById("modalContainer");

    function loadState() {
      try {
        const saved = localStorage.getItem(saveKey);
        if (!saved) return structuredClone(initialState);
        const parsed = JSON.parse(saved);
        const loaded = normalizeState(parsed);
        loaded.rounds.forEach(round => {
          round.locked = true;
        });
        loaded.settingsLocked = true;
        return loaded;
      } catch {
        return structuredClone(initialState);
      }
    }

    function normalizeState(raw) {
      const state = {
        rate: Number.isFinite(Number(raw.rate)) ? Number(raw.rate) : 50,
        settingsLocked: Boolean(raw.settingsLocked),
        selectAllOnFocus: raw.selectAllOnFocus !== false,
        players: Array.isArray(raw.players) ? raw.players.slice(0, playerCount) : initialState.players.slice(),
        rounds: Array.isArray(raw.rounds) ? raw.rounds : []
      };

      while (state.players.length < playerCount) {
        state.players.push("");
      }

      state.rounds = state.rounds.map((round, index) => ({
        number: Number.isFinite(Number(round.number)) ? Number(round.number) : index + 1,
        inputs: normalizeInputs(round.inputs),
        locked: Boolean(round.locked)
      }));

      if (state.rounds.length === 0) {
        state.rounds = structuredClone(initialState.rounds);
      }

      return state;
    }

    function normalizeInputs(inputs) {
      const values = Array.isArray(inputs) ? inputs.slice(0, playerCount) : [];
      while (values.length < playerCount) {
        values.push(null);
      }
      return values.map(value => {
        if (value === null || value === undefined || value === "") {
          return null;
        }

        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      });
    }

    function saveState() {
      localStorage.setItem(saveKey, JSON.stringify(state));
    }

    function hideImagePreview() {
      imagePreview.classList.remove("show");
      scoreImage.removeAttribute("src");
      downloadImage.href = "#";
    }

    function completedScores(round) {
      const values = normalizeInputs(round.inputs);
      const entered = values.filter(value => value !== null);
      const blankIndexes = values
        .map((value, index) => value === null ? index : -1)
        .filter(index => index >= 0);

      if (entered.length === 0) {
        return Array(playerCount).fill(null);
      }

      if (blankIndexes.length === 1) {
        const sum = entered.reduce((total, value) => total + value, 0);
        values[blankIndexes[0]] = -sum;
      }

      return values;
    }

    function totals() {
      const result = Array(playerCount).fill(0);
      for (const round of state.rounds) {
        completedScores(round).forEach((value, index) => {
          result[index] += value ?? 0;
        });
      }
      return result;
    }

    function signed(value) {
      if (value > 0) return `+${value}`;
      return String(value);
    }

    function signedImage(value) {
      if (value > 0) return `+${value}`;
      return String(value);
    }

    function yen(value) {
      const abs = Math.abs(value).toLocaleString("ja-JP");
      if (value > 0) return `+${abs}円`;
      if (value < 0) return `-${abs}円`;
      return "0円";
    }

    function yenImage(value) {
      const abs = Math.abs(value).toLocaleString("ja-JP");
      if (value > 0) return `+${abs}円`;
      if (value < 0) return `-${abs}円`;
      return "0円";
    }

    function scoreClass(value) {
      if (value > 0) return "plus";
      if (value < 0) return "minus";
      return "";
    }

    function drawRoundRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    function drawText(ctx, text, x, y, options = {}) {
      ctx.fillStyle = options.color ?? "#17202a";
      ctx.font = `${options.weight ?? 400} ${options.size ?? 23}px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.textAlign = options.align ?? "center";
      ctx.textBaseline = options.baseline ?? "middle";
      ctx.fillText(text, x, y);
    }

    function drawReverseTitle(ctx, text, x, y, width, height) {
      ctx.fillStyle = "#17202a";
      drawRoundRect(ctx, x, y, width, height, 8);
      ctx.fill();
      drawText(ctx, ` ${text} `, x + width / 2, y + height / 2, {
        color: "#ffffff",
        weight: 700,
        size: 108
      });
    }

    function colorForValue(value) {
      if (value > 0) return "#1264c8";
      if (value < 0) return "#c83232";
      return "#17202a";
    }

    function colorForValueImage(value) {
      if (value > 0) return "#1264c8";
      if (value < 0) return "#c83232";
      return "#17202a";
    }

    function roundsForImage() {
      const lastEnteredIndex = lastEnteredRoundIndex();
      if (lastEnteredIndex < 0) {
        return [];
      }
      return state.rounds.slice(0, lastEnteredIndex + 1);
    }

    function lastEnteredRoundIndex() {
      return state.rounds.reduce((last, round, index) => {
        return round.inputs.some(value => value !== null) ? index : last;
      }, -1);
    }

    function focusRoundInput(roundIndex) {
      const safeRoundIndex = Math.max(0, Math.min(roundIndex, state.rounds.length - 1));
      const container = currentInPopupRoundIndex !== null ? modalContainer : roundsEl;
      const targetInput = container.querySelector(`input[data-round="${safeRoundIndex}"][data-player="0"]`);
      if (targetInput) {
        targetInput.focus();
        applyInputModeSelection(targetInput);
      }
    }

    function applyInputModeSelection(input) {
      setTimeout(() => {
        if (state.selectAllOnFocus) {
          input.select();
          return;
        }
        const length = input.value.length;
        input.setSelectionRange(length, length);
      }, 0);
    }

    function makeScoreImage() {
      let dataUrl = "";
      try {
      const imageRounds = roundsForImage();
      const rawTotals = totals();
      const scale = 1;
      const cssWidth = 1800;
      const padding = 56;
      const gap = 28;
      const imageFont = 92;
      const imageSmallFont = 64;
      const totalRowHeight = 140;
      const roundCardHeight = 580;
      const headerHeight = 140;
      const bottomBlankLine = imageFont * 1.25;
      const totalSectionHeight = headerHeight + totalRowHeight * playerCount + gap;
      const roundsHeight = imageRounds.length === 0 ? 74 : imageRounds.length * (roundCardHeight + gap);
      const cssHeight = padding * 2 + totalSectionHeight + roundsHeight + bottomBlankLine;
      const canvas = document.createElement("canvas");
      canvas.width = cssWidth * scale;
      canvas.height = cssHeight * scale;
      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, cssWidth, cssHeight);

      drawReverseTitle(ctx, "合計", padding, padding, 320, 128);
      drawText(ctx, `換算 ${state.rate}x`, cssWidth - padding, padding + 64, {
        align: "right",
        size: imageSmallFont,
        color: "#647282"
      });

      const totalY = padding + headerHeight;
      drawRoundRect(ctx, padding, totalY, cssWidth - padding * 2, totalRowHeight * playerCount, 8);
      ctx.strokeStyle = "#d9e0e7";
      ctx.lineWidth = 3;
      ctx.stroke();

      for (let index = 0; index < playerCount; index += 1) {
        const rowY = totalY + totalRowHeight * index;
        const total = rawTotals[index];
        const converted = total * state.rate;

        if (index > 0) {
          ctx.beginPath();
          ctx.moveTo(padding + 18, rowY);
          ctx.lineTo(cssWidth - padding - 18, rowY);
          ctx.strokeStyle = "#d9e0e7";
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        drawText(ctx, state.players[index] || `P${index + 1}`, padding + 28, rowY + totalRowHeight / 2, {
          align: "left",
          color: "#17202a",
          weight: 700,
          size: imageFont
        });
        drawText(ctx, signedImage(total), cssWidth - padding - 620, rowY + totalRowHeight / 2, {
          align: "right",
          color: colorForValueImage(total),
          weight: 700,
          size: imageFont
        });
        drawText(ctx, yenImage(converted), cssWidth - padding - 28, rowY + totalRowHeight / 2, {
          align: "right",
          color: colorForValueImage(converted),
          size: imageFont
        });
      }

      let y = totalY + totalRowHeight * playerCount + gap + 70;
      drawReverseTitle(ctx, "入力", padding, y - 64, 320, 128);
      y += 100;

      if (imageRounds.length === 0) {
        drawText(ctx, "入力済みの点数はありません", cssWidth / 2, y + 24, {
          color: "#647282",
          size: imageSmallFont
        });
      }

      const inputCardWidth = (cssWidth - padding * 2 - gap * 3) / 4;
      for (const round of imageRounds) {
        const scores = completedScores(round);
        const balance = scores.reduce((total, value) => total + (value ?? 0), 0);
        drawRoundRect(ctx, padding, y, cssWidth - padding * 2, roundCardHeight, 8);
        ctx.strokeStyle = "#d9e0e7";
        ctx.lineWidth = 3;
        ctx.stroke();

        drawText(ctx, `${round.number}回`, padding + 42, y + 78, {
          align: "left",
          weight: 700,
          size: imageFont
        });
        drawText(ctx, balance === 0 ? "±0" : `差額 ${signedImage(balance)}`, cssWidth - padding - 42, y + 78, {
          align: "right",
          color: balance === 0 ? "#647282" : "#a65f00",
          size: imageSmallFont
        });

        for (let index = 0; index < playerCount; index += 1) {
          const x = padding + index * (inputCardWidth + gap);
          const cardY = y + 170;
          drawRoundRect(ctx, x, cardY, inputCardWidth, 350, 8);
          ctx.strokeStyle = "#d9e0e7";
          ctx.lineWidth = 3;
          ctx.stroke();
          drawText(ctx, state.players[index] || `P${index + 1}`, x + inputCardWidth / 2, cardY + 80, {
            color: "#17202a",
            weight: 700,
            size: imageFont
          });
          const entered = round.inputs[index];
          drawText(ctx, entered === null ? "" : signedImage(entered), x + inputCardWidth / 2, cardY + 195, {
            size: imageFont
          });
          const value = scores[index];
          drawText(ctx, value === null ? "-" : signedImage(value), x + inputCardWidth / 2, cardY + 315, {
            color: colorForValueImage(value ?? 0),
            weight: 700,
            size: imageFont
          });
        }

        y += roundCardHeight + gap;
      }

      dataUrl = canvas.toDataURL("image/png");
      } catch (error) {
        console.error(error);
        alert("画像生成に失敗しました。入力回数を減らすか、Safariで再読み込みしてからもう一度お試しください。");
        return;
      }
      scoreImage.src = dataUrl;
      downloadImage.href = dataUrl;
      imagePreview.classList.add("show");
      imagePreview.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function render() {
      const settingsLocked = Boolean(state.settingsLocked);
      document.querySelectorAll(".setting-card").forEach(card => {
        card.classList.toggle("locked", settingsLocked);
      });
      rateInput.value = state.rate;
      rateInput.disabled = settingsLocked;
      playerInputs.forEach((input, index) => {
        input.value = state.players[index] ?? "";
        input.disabled = settingsLocked;
      });
      renderSettingsLockButton();
      renderInputModeButton();

      renderTotals();
      renderRounds();

      // もし現在ポップアップが開いているなら、ポップアップ内の表示も同期更新する
      if (currentInPopupRoundIndex !== null) {
        updateModalDisplay();
      }
    }

    function renderSettingsLockButton() {
      const locked = Boolean(state.settingsLocked);
      settingsLockToggleButton.classList.toggle("locked", locked);
      settingsLockToggleButton.textContent = locked ? "入力ロック解除" : "入力ロック";
    }

    function renderInputModeButton() {
      const active = Boolean(state.selectAllOnFocus);
      inputModeToggleButton.classList.toggle("active", active);
      inputModeToggleButton.textContent = active ? "入力モードON" : "入力モードOFF";
    }

    function renderTotals() {
      const rawTotals = totals();
      rateLabel.textContent = `換算 ${state.rate}x`;
      totalsEl.innerHTML = "";

      rawTotals.forEach((total, index) => {
        const converted = total * state.rate;
        const card = document.createElement("div");
        card.className = "total-card";
        card.innerHTML = `
          <div class="name">${escapeHtml(state.players[index] || `P${index + 1}`)}</div>
          <div class="score ${scoreClass(total)}">${signed(total)}</div>
          <div class="money ${scoreClass(converted)}">${yen(converted)}</div>
        `;
        totalsEl.appendChild(card);
      });
    }

    // 元のHTML文字列生成ロジックを1文字も崩さず共通化
    function makeRoundHtml(round, roundIndex) {
      const scores = completedScores(round);
      const balance = scores.reduce((total, value) => total + (value ?? 0), 0);
      const isLocked = Boolean(round.locked);

      const rows = state.players.map((player, playerIndex) => {
        const inputValue = round.inputs[playerIndex] ?? "";
        const autoValue = scores[playerIndex];
        
        return `
          <div class="input-card ${isLocked ? "locked" : ""}">
            <button 
              type="button" 
              class="player-btn" 
              data-invert-round="${roundIndex}" 
              data-invert-player="${playerIndex}"
              ${isLocked ? "disabled" : ""}
            >
              ${escapeHtml(player || `P${playerIndex + 1}`)}
            </button>
            <input
              type="text"
              inputmode="numeric"
              maxlength="5"
              pattern="-?[0-9]{0,4}"
              value="${escapeHtml(String(inputValue))}"
              data-round="${roundIndex}"
              data-player="${playerIndex}"
              aria-label="${escapeHtml((player || `P${playerIndex + 1}`) + " " + round.number + "回")}"
              ${isLocked ? "disabled" : ""}
            >
            <div class="auto ${scoreClass(autoValue ?? 0)}" data-player-auto="${playerIndex}">${autoValue === null ? "-" : signed(autoValue)}</div>
          </div>
        `;
      }).join("");

      // 指示：ポップ画面（currentInPopupRoundIndexと一致）では「入力」の文字を「入力完了」に変え、専用のスタイルを当てる
      const isCurrentlyPopup = (currentInPopupRoundIndex === roundIndex);
      const lockButtonText = isLocked ? "入力" : (isCurrentlyPopup ? "入力完了" : "入力ロック");
      const lockButtonClass = (isCurrentlyPopup && !isLocked) ? "small round-lock editing-active" : `small round-lock ${isLocked ? "locked" : ""}`;

      return `
        <div class="round-head">
          <div class="round-title">
            <div>${round.number}回</div>
            <button type="button" class="danger small round-clear" data-round-clear="${roundIndex}">点数クリア</button>
            <button type="button" class="${lockButtonClass}" data-round-lock="${roundIndex}">${lockButtonText}</button>
          </div>
          <div class="balance ${balance === 0 ? "" : "warn"}">${balance === 0 ? "±0" : `差額 ${signed(balance)}`}</div>
        </div>
        <div class="round-grid">${rows}</div>
      `;
    }

    function renderRounds() {
      roundsEl.innerHTML = "";

      state.rounds.forEach((round, roundIndex) => {
        const roundEl = document.createElement("div");
        roundEl.className = "round";
        roundEl.dataset.roundIndex = String(roundIndex);
        roundEl.innerHTML = makeRoundHtml(round, roundIndex);
        roundsEl.appendChild(roundEl);
      });
    }

    // 指示：ポップ画面（モーダル）を開く処理
    function openRoundPopup(roundIndex) {
      currentInPopupRoundIndex = roundIndex;
      state.rounds[roundIndex].locked = false; // ロックを自動解除して編集状態へ

      document.body.classList.add("modal-open");
      modalOverlay.classList.add("show");
      
      updateModalDisplay();
    }

    // 指示：ポップ画面（モーダル）を閉じる処理
    function closeRoundPopup() {
      if (currentInPopupRoundIndex !== null) {
        state.rounds[currentInPopupRoundIndex].locked = true; // 「入力完了」で自動的に入力ロック状態に戻す
      }
      document.body.classList.remove("modal-open");
      modalOverlay.classList.remove("show");
      currentInPopupRoundIndex = null;
      
      saveState();
      render();
    }

    // ポップアップ内の表示を同期・更新する処理
    function updateModalDisplay() {
      if (currentInPopupRoundIndex === null) return;
      const round = state.rounds[currentInPopupRoundIndex];
      
      modalContainer.innerHTML = `
        <div class="round" data-round-index="${currentInPopupRoundIndex}">
          ${makeRoundHtml(round, currentInPopupRoundIndex)}
        </div>
      `;

      // ポップアップ内の最初のインプットボックスに自動フォーカス
      const firstInput = modalContainer.querySelector("input");
      if (firstInput) {
        firstInput.focus();
        applyInputModeSelection(firstInput);
      }
    }

    function updateRoundDisplay(roundIndex) {
      const round = state.rounds[roundIndex];
      if (!round) return;

      // メイン画面側の一覧を更新
      const roundEl = roundsEl.querySelector(`.round[data-round-index="${roundIndex}"]`);
      if (roundEl) {
        roundEl.innerHTML = makeRoundHtml(round, roundIndex);
      }

      // ポップアップ画面側が開いているなら、そちらの合計値や補完文字表示も同期更新
      if (currentInPopupRoundIndex === roundIndex) {
        const scores = completedScores(round);
        const balance = scores.reduce((total, value) => total + (value ?? 0), 0);
        
        const modalBalanceEl = modalContainer.querySelector(".balance");
        if (modalBalanceEl) {
          modalBalanceEl.classList.toggle("warn", balance !== 0);
          modalBalanceEl.textContent = balance === 0 ? "±0" : `差額 ${signed(balance)}`;
        }

        scores.forEach((value, playerIndex) => {
          const autoEl = modalContainer.querySelector(`.auto[data-player-auto="${playerIndex}"]`);
          if (!autoEl) return;
          autoEl.className = `auto ${scoreClass(value ?? 0)}`;
          autoEl.textContent = value === null ? "-" : signed(value);
        });
      }
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    rateInput.addEventListener("input", event => {
      if (state.settingsLocked) {
        render();
        return;
      }
      state.rate = Number(event.target.value) || 0;
      saveState();
      hideImagePreview();
      renderTotals();
    });

    playerInputs.forEach((input, index) => {
      input.addEventListener("input", event => {
        if (state.settingsLocked) {
          render();
          return;
        }
        state.players[index] = event.target.value;
        saveState();
        hideImagePreview();
        renderTotals();
        renderRounds();
      });
    });

    [rateInput, ...playerInputs].forEach(input => {
      input.addEventListener("focusin", event => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement)) return;
        if (target.disabled) return;
        applyInputModeSelection(target);
      });

      input.addEventListener("pointerup", event => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement)) return;
        if (target.disabled) return;
        applyInputModeSelection(target);
      });
    });

    // メイン画面およびポップアップ画面の双方からの数値入力を一括して安全に受け取るリスナー
    const globalInputHandler = event => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement)) return;
      const roundIndex = Number(target.dataset.round);
      const playerIndex = Number(target.dataset.player);
      if (state.rounds[roundIndex]?.locked) {
        render();
        return;
      }
      let raw = target.value.trim();
      raw = raw.replace(/[^\d-]/g, "");
      raw = raw.replace(/(?!^)-/g, "");
      const sign = raw.startsWith("-") ? "-" : "";
      const digits = raw.replace("-", "").slice(0, 4);
      raw = sign + digits;
      if (target.value !== raw) {
        target.value = raw;
      }

      // 同期元のもう一方のテキストボックス（メイン画面⇔ポップ画面）の数値表示をリアルタイム追従
      const targetContainers = [roundsEl, modalContainer];
      targetContainers.forEach(container => {
        const sisterInput = container.querySelector(`input[data-round="${roundIndex}"][data-player="${playerIndex}"]`);
        if (sisterInput && sisterInput !== target) {
          sisterInput.value = raw;
        }
      });

      if (raw === "" || raw === "-") {
        state.rounds[roundIndex].inputs[playerIndex] = null;
      } else {
        state.rounds[roundIndex].inputs[playerIndex] = Number(raw);
      }
      saveState();
      hideImagePreview();
      renderTotals();
      updateRoundDisplay(roundIndex);
    };

    roundsEl.addEventListener("input", globalInputHandler);
    modalContainer.addEventListener("input", globalInputHandler);

    const globalFocusHandler = event => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement)) return;
      if (target.disabled) return;
      applyInputModeSelection(target);
    };

    roundsEl.addEventListener("focusin", globalFocusHandler);
    modalContainer.addEventListener("focusin", globalFocusHandler);
    roundsEl.addEventListener("pointerup", globalFocusHandler);
    modalContainer.addEventListener("pointerup", globalFocusHandler);

    // メイン画面およびポップアップ画面の双方からのクリックを安全に統合処理する共通コアロジック
    function handleGlobalClick(target) {
      // 1. 名前ボタンがクリックされた時の符号反転処理
      if (target.classList.contains("player-btn")) {
        const roundIndex = Number(target.dataset.invertRound);
        const playerIndex = Number(target.dataset.invertPlayer);
        
        if (state.rounds[roundIndex]?.locked) return;
        
        const currentVal = state.rounds[roundIndex].inputs[playerIndex];
        if (currentVal !== null && currentVal !== 0) {
          const newVal = -currentVal;
          state.rounds[roundIndex].inputs[playerIndex] = newVal;
          
          // ポップ画面とメイン画面の両方のテキストボックスをその場で書き換え
          const targetContainers = [roundsEl, modalContainer];
          targetContainers.forEach(container => {
            const inputEl = container.querySelector(`input[data-round="${roundIndex}"][data-player="${playerIndex}"]`);
            if (inputEl) {
              inputEl.value = String(newVal);
            }
          });
          
          saveState();
          hideImagePreview();
          renderTotals();
          updateRoundDisplay(roundIndex);
        }
        return;
      }

      if (!(target instanceof HTMLButtonElement)) return;

      // 2. 「入力」/「入力完了」の鍵となるボタンが押された時の処理
      if (target.dataset.roundLock !== undefined) {
        const roundIndex = Number(target.dataset.roundLock);
        if (!Number.isInteger(roundIndex)) return;
        
        // 指示：ポップアップ画面で「入力完了」がクリックされた場合はポップアップを閉じる
        if (currentInPopupRoundIndex === roundIndex) {
          closeRoundPopup();
        } else {
          // メイン画面で「入力」がクリックされた場合は、元の画面を維持してポップアップを開く
          openRoundPopup(roundIndex);
        }
        return;
      }

      // 3. 各回の「点数クリア」ボタン処理
      if (target.dataset.roundClear !== undefined) {
        const roundIndex = Number(target.dataset.roundClear);
        if (!Number.isInteger(roundIndex)) return;
        const round = state.rounds[roundIndex];
        if (!round) return;
        if (!confirm(`${round.number}回の点数をクリアしますか？`)) return;
        round.inputs = Array(playerCount).fill(null);
        round.locked = true;
        
        if (currentInPopupRoundIndex === roundIndex) {
          closeRoundPopup();
        } else {
          saveState();
          hideImagePreview();
          renderTotals();
          renderRounds();
        }
        return;
      }
    }

    roundsEl.addEventListener("click", event => handleGlobalClick(event.target));
    modalContainer.addEventListener("click", event => handleGlobalClick(event.target));

    addRoundButton.addEventListener("click", () => {
      const nextNumber = Math.max(...state.rounds.map(round => round.number), 0) + 1;
      state.rounds.push({
        number: nextNumber,
        inputs: Array(playerCount).fill(null),
        locked: true
      });
      saveState();
      hideImagePreview();
      renderRounds();
    });

    function lockAllInputs() {
      if (!state.settingsLocked) {
        state.settingsLocked = true;
      }
      state.rounds.forEach(round => {
        if (!round.locked) {
          round.locked = true;
        }
      });
      if (currentInPopupRoundIndex !== null) {
        document.body.classList.remove("modal-open");
        modalOverlay.classList.remove("show");
        currentInPopupRoundIndex = null;
      }
      saveState();
      hideImagePreview();
      render();
    }

    settingsLockToggleButton.addEventListener("click", () => {
      const nextLocked = !Boolean(state.settingsLocked);
      state.settingsLocked = nextLocked;
      saveState();
      hideImagePreview();
      render();
      if (!nextLocked) {
        setTimeout(() => {
          rateInput.focus();
          applyInputModeSelection(rateInput);
        }, 0);
      }
    });

    inputModeToggleButton.addEventListener("click", () => {
      state.selectAllOnFocus = !Boolean(state.selectAllOnFocus);
      saveState();
      renderInputModeButton();
    });

    toggleAllLocksButton.addEventListener("click", lockAllInputs);

    jumpToSettingsButton.addEventListener("click", () => {
      rateInput.scrollIntoView({ behavior: "smooth", block: "center" });
      if (state.settingsLocked) {
        settingsLockToggleButton.focus();
      } else {
        rateInput.focus();
        applyInputModeSelection(rateInput);
      }
    });

    jumpToInputButton.addEventListener("click", () => {
      const lastIndex = lastEnteredRoundIndex();
      focusRoundInput(lastIndex >= 0 ? lastIndex : 0);
    });

    makeImageButton.addEventListener("click", () => {
      makeScoreImage();
    });

    backToInputFromImageButton.addEventListener("click", () => {
      const lastIndex = lastEnteredRoundIndex();
      focusRoundInput(lastIndex >= 0 ? lastIndex : 0);
    });

    clearScoresButton.addEventListener("click", () => {
      if (!confirm("全ての点数をクリアしますか？ 名前と倍率は残します。")) return;
      state.rounds = state.rounds.map(round => ({
        number: round.number,
        inputs: Array(playerCount).fill(null),
        locked: true
      }));
      state.settingsLocked = true;
      if (currentInPopupRoundIndex !== null) {
        document.body.classList.remove("modal-open");
        modalOverlay.classList.remove("show");
        currentInPopupRoundIndex = null;
      }
      saveState();
      hideImagePreview();
      render();
    });

    render();
  </script>
</body>
</html>
